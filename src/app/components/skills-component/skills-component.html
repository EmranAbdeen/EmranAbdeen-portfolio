<section class="skills container" data-aos="fade-up" data-aos-delay="400" id="skills">
  <div class="skills__container">
    <h2 class="skills__title">Skills</h2>
    <ul class="skills__list">
      @for (skill of skills; track skill.Id) {
        <li class="skills__item">
          <img [src]="skill.Image" [alt]="skill.Title" class="skills__image" />
          <h3 class="skills__item-title">{{ skill.Title }}</h3>
          <p class="skills__item-description">{{ skill.Description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
